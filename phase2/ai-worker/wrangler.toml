# Cloudflare Worker config for the Fall Hike App's live AI answers.
# Deploy: npx wrangler deploy   (see README.md in this folder)

name = "fall-hike-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Only the app's own site may call this Worker (comma-separate to add more,
# e.g. "https://rmbk18.github.io,http://localhost:8000" for local testing).
# Origins have no path: NOT https://rmbk18.github.io/Trail-Season/
ALLOWED_ORIGIN = "https://rmbk18.github.io"

# The Workers AI model to use (must support JSON Mode). Change it here if
# Cloudflare retires it.
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# NTFY_TOPIC is a secret, so it is NOT set here. Add it in the Cloudflare
# dashboard (Worker → Settings → Variables and Secrets) or with:
#   npx wrangler secret put NTFY_TOPIC

# Cloudflare Workers AI: runs the model inside Cloudflare, no API key needed.
# The free plan includes a daily allowance (10,000 Neurons, about 125 questions).
[ai]
binding = "AI"

# Per-visitor rate limit: 10 questions per minute per IP address.
# Protects your free daily AI allowance if someone finds the URL.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
