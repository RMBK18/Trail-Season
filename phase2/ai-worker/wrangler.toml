# Cloudflare Worker config for the Fall Hike App's live AI answers.
# Deploy: npx wrangler deploy   (see README.md in this folder)

name = "fall-hike-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
# Only the app's own site may call this Worker (comma-separate to add more,
# e.g. "https://rmbk18.github.io,http://localhost:8000" for local testing).
# Origins have no path: NOT https://rmbk18.github.io/Trail-Season/
ALLOWED_ORIGIN = "https://rmbk18.github.io"

# The xAI model to use. Change it here if xAI retires it (see docs.x.ai).
XAI_MODEL = "grok-4.3"

# XAI_API_KEY and NTFY_TOPIC are secrets, so they are NOT set here. Add them in
# the Cloudflare dashboard (Worker → Settings → Variables and Secrets) or with:
#   npx wrangler secret put XAI_API_KEY
#   npx wrangler secret put NTFY_TOPIC

# Per-visitor rate limit: 10 questions per minute per IP address.
# Protects your xAI credits if someone finds the URL.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
